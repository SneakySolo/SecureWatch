<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SecureWatch — User Events</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────────────────────── -->
<nav class="navbar">
    <a th:href="@{/dashboard/users}" class="navbar-brand">
        <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
                <path d="M16 2L4 8v8c0 7.18 5.16 13.9 12 15.56C22.84 29.9 28 23.18 28 16V8L16 2z"
                      stroke="#00d4ff" stroke-width="1.5" fill="none"/>
                <path d="M12 16l3 3 6-6" stroke="#00d4ff" stroke-width="1.5"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        SecureWatch
    </a>

    <div class="navbar-links">
        <a th:href="@{/dashboard/users}" class="nav-link">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
            </svg>
            Users
        </a>
        <a th:href="@{/dashboard/blocked}" class="nav-link">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="10"/>
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
            </svg>
            Blocked
        </a>
    </div>

    <div class="navbar-right">
        <div class="admin-chip">
            <span class="status-dot"></span>
            <span th:text="${adminUser}">admin</span>
        </div>
        <a th:href="@{/dashboard/logout}" class="btn-logout">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Logout
        </a>
    </div>
</nav>

<!-- ── Page Body ───────────────────────────────────────────────────────── -->
<div class="page-body">
    <div class="page-inner">

        <a th:href="@{/dashboard/users}" class="back-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
            Back to Users
        </a>

        <!-- User strip -->
        <div class="user-strip">
            <div class="user-strip-avatar"
                 th:text="${#strings.substring(targetUser, 0, 1).toUpperCase()}">U</div>
            <div>
                <div class="user-strip-name" th:text="${targetUser}">username</div>
                <div class="user-strip-sub" th:text="${#lists.size(events)} + ' suspicious events recorded'"></div>
            </div>
        </div>

        <div class="page-header">
            <div>
                <h1 class="page-title">Suspicious Events</h1>
                <p class="page-subtitle">Full security history for this user</p>
            </div>
            <span class="count-badge" th:text="${#lists.size(events)} + ' records'">0 records</span>
        </div>

        <div class="table-card">
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Event Type</th>
                        <th>IP Address</th>
                        <th>Description</th>
                        <th>Timestamp</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(events)}">
                        <td colspan="5" class="empty-row">No suspicious events recorded for this user</td>
                    </tr>
                    <tr th:each="event : ${events}">
                        <td class="mono" th:text="${event.id}"></td>
                        <td>
                                <span class="badge"
                                      th:classappend="${event.eventType == 'BRUTE_FORCE_ATTEMPT'} ? ' badge--danger' :
                                                      (${event.eventType == 'HONEYPOT_TRIGGERED'}  ? ' badge--purple' :
                                                      (${event.eventType == 'NEW_IP_LOGIN'}         ? ' badge--warning' :
                                                      (${event.eventType == 'RAPID_REQUESTS'}       ? ' badge--cyan' : ' badge--success')))"
                                      th:text="${event.eventType}">
                                </span>
                        </td>
                        <td class="mono" th:text="${event.ipAddress}"></td>
                        <td th:text="${event.description}"></td>
                        <td class="timestamp"
                            th:text="${#temporals.format(event.timestamp, 'yyyy-MM-dd HH:mm:ss')}">
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

</body>
</html>
