<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SecureWatch — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="login-body">

<div class="login-bg"><div class="grid-overlay"></div></div>

<div class="login-wrapper">

    <div class="login-brand">
        <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
                <path d="M16 2L4 8v8c0 7.18 5.16 13.9 12 15.56C22.84 29.9 28 23.18 28 16V8L16 2z"
                      stroke="#00d4ff" stroke-width="1.5" fill="none"/>
                <path d="M12 16l3 3 6-6" stroke="#00d4ff" stroke-width="1.5"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        SecureWatch
    </div>

    <div class="login-card">
        <div class="login-header">
            <h1>Admin Access</h1>
            <p>Restricted to authorized personnel only</p>
        </div>

        <div class="alert-error" th:if="${error}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/dashboard/login}" method="post" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       placeholder="admin" autocomplete="off" required/>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="••••••••" required/>
            </div>
            <button type="submit" class="btn-login">
                <span>Authenticate</span>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
        </form>
    </div>

    <p class="login-footer">SecureWatch Intelligent Security Monitoring System</p>
</div>

</body>
</html>
