<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SecureWatch — Users</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>

<nav class="navbar">
    <a th:href="@{/dashboard/users}" class="navbar-brand">
        <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 32 32" fill="none">
                <path d="M16 2L4 8v8c0 7.18 5.16 13.9 12 15.56C22.84 29.9 28 23.18 28 16V8L16 2z"
                      stroke="#ffffff" stroke-width="1.8" fill="none"/>
                <path d="M12 16l3 3 6-6" stroke="#ffffff" stroke-width="1.8"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        SecureWatch
    </a>

    <div class="navbar-right">
        <a th:href="@{/dashboard/users}" class="nav-link active">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
            </svg>
            Users
        </a>
        <a th:href="@{/dashboard/blocked}" class="nav-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
            </svg>
            Blocked
        </a>

        <div class="nav-divider"></div>

        <div class="admin-chip">
            <span class="status-dot"></span>
            <span th:text="${adminUser}">admin</span>
        </div>
        <a th:href="@{/dashboard/logout}" class="btn-logout">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Logout
        </a>
    </div>
</nav>

<div class="page-body">
    <div class="page-inner">

        <div class="page-header">
            <div>
                <h1 class="page-title">Active Users</h1>
                <p class="page-subtitle">Sorted by risk score — click a username to see their full history</p>
            </div>
            <span class="count-badge" th:text="${#lists.size(users)} + ' total'">0 total</span>
        </div>

        <div class="table-card">
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Risk Score</th>
                        <th>Total Events</th>
                        <th>Last Activity</th>
                        <th>Member Since</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="7" class="empty-row">No active users found</td>
                    </tr>
                    <tr th:each="user : ${users}">
                        <td>
                            <a th:href="@{/dashboard/users/{u}/events(u=${user.username})}"
                               class="row-link"
                               th:text="${user.username}">
                            </a>
                        </td>
                        <td class="mono" th:text="${user.email}"></td>
                        <td>
                            <div class="risk-wrap">
                                    <span class="risk-num"
                                          th:classappend="${user.riskScore >= 10} ? ' high' : (${user.riskScore >= 5} ? ' mid' : ' low')"
                                          th:text="${user.riskScore}">0</span>
                                <div class="risk-bar">
                                    <div class="risk-fill"
                                         th:classappend="${user.riskScore >= 10} ? ' high' : (${user.riskScore >= 5} ? ' mid' : ' low')"
                                         th:style="'width:' + ${#numbers.formatDecimal(T(java.lang.Math).min(user.riskScore * 6.66, 100.0), 0, 0)} + '%'">
                                    </div>
                                </div>
                            </div>
                        </td>
                        <td>
                                <span class="badge"
                                      th:classappend="${user.totalSuspiciousEvents > 5} ? ' badge--danger' : (${user.totalSuspiciousEvents > 0} ? ' badge--warning' : ' badge--success')"
                                      th:text="${user.totalSuspiciousEvents}">0</span>
                        </td>
                        <td class="timestamp"
                            th:text="${user.lastActivity != null} ? ${#temporals.format(user.lastActivity, 'dd MMM, HH:mm')} : '—'">
                        </td>
                        <td class="timestamp"
                            th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">
                        </td>
                        <td>
                            <form th:action="@{/dashboard/users/{u}/block(u=${user.username})}" method="post">
                                <button type="submit" class="btn-block">Block</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

</body>
</html>
